<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGCSE Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#151A31; --muted:#5A6180; --line:#DCE0EC; --grid:#E6E9F3;
  --accent:#2A47C9; --accent-soft:#E7EBFC; --ok:#1F8A4C; --warn:#B4610A;
  --c-math:#2F5BE0; --c-eng:#0E8585; --c-spa:#D0393E; --c-bio:#3C8C2C; --c-chem:#8A4BD6; --c-phys:#C98200; --c-mix:#7A8099; --c-stats:#0A94C2; --c-bus:#B5338A; --c-fr:#8B5A2B;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1120; --surface:#161A2E; --ink:#E7E9F4; --muted:#9BA1BE; --line:#2A3050; --grid:#1C2139;
  --accent:#8FA3FF; --accent-soft:#222A55; --ok:#5BCB8A; --warn:#F0A54A;
  --c-math:#7C9BFF; --c-eng:#3FC2C2; --c-spa:#FF7378; --c-bio:#7BC96A; --c-chem:#B990FF; --c-phys:#F2B84B; --c-mix:#9AA0BB; --c-stats:#4CC4EE; --c-bus:#F07AC4; --c-fr:#D9A06A;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:var(--accent)}
.top{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font:600 .85rem var(--f-body)}
.top a{text-decoration:none}
.nav{display:flex;gap:12px;flex-wrap:wrap}
main{max-width:820px;margin:0 auto;padding-top:28px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pill{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:#fff}
.pill.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
article h1{font:800 clamp(1.8rem,4.5vw,2.6rem)/1.08 var(--f-display);letter-spacing:-.01em;margin:0 0 18px;text-wrap:balance}
article h2{font:700 1.45rem/1.2 var(--f-display);margin:2.2em 0 .6em;padding-top:.6em;border-top:2px solid var(--line)}
article h3{font:700 1.12rem/1.3 var(--f-display);margin:1.6em 0 .4em}
article h4{font-weight:600;margin:1.2em 0 .3em}
article p,article li{max-width:72ch}
article ul,article ol{padding-left:1.4em}
article li{margin:.2em 0}
article blockquote{margin:0 0 1em;padding:12px 16px;background:var(--accent-soft);border-radius:10px;border:none}
article blockquote p{margin:.2em 0}
article code{font:.9em var(--f-mono);background:var(--grid);padding:1px 5px;border-radius:4px}
article pre{background:var(--grid);padding:12px 14px;border-radius:8px;overflow-x:auto}
article pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:1em 0}
article table{border-collapse:collapse;font-size:.92rem;min-width:60%}
article th,article td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
article th{background:var(--grid);font-weight:600}
article details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:1em 0}
article summary{cursor:pointer;font-weight:600;color:var(--accent)}
article hr{border:none;border-top:1px solid var(--line);margin:2em 0}
.week{margin-top:2em;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.week h2{margin-top:0;border:none;padding:0}
.state{color:var(--muted);padding:40px 0}
footer{max-width:820px;margin:48px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 .9rem var(--f-body)}
footer a{text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;max-width:48%}
footer span{display:block;font:500 .72rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media print{.top,footer{display:none}body{background:#fff}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IGCSE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#151A31">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}))}</script>
</head>
<body>
<header class="top"><div class="top-in"><a id="back" href="./">← Back to the plan</a><div class="nav" id="nav"></div></div></header>
<main>
  <div class="meta" id="meta"></div>
  <article id="doc"><p class="state">Loading…</p></article>
  <section id="weekTopics" hidden></section>
</main>
<footer id="pager"></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function(){
const SUBJ={math:['Maths',20,7],stats:['Statistics',9,4],bio:['Biology',13,4],chem:['Chemistry',13,4],phys:['Physics',12,4],bus:['Business',12,4],eng:['English',12,5],fr:['French',10,4],spa:['Spanish',6,2]};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const q=new URLSearchParams(location.search);
const id=(q.get('id')||'').replace(/[^a-z0-9-]/gi,'');
const d=q.get('d')||'';
const lang=q.get('lang')==='es'?'es':'en';
const plan=lang==='es'?'es/':'./';
const back=document.getElementById('back');
let ret=null;try{ret=JSON.parse(sessionStorage.getItem('igcse-return')||'null')}catch(e){}
back.href=ret&&ret.url?ret.url:plan+(d?'#d-'+d:'');back.textContent=lang==='es'?'← Volver':'← Back';
back.addEventListener('click',e=>{if(ret&&ret.url){e.preventDefault();location.href=ret.url}});

const m=id.match(/^([a-z]+)-(r1|r2)-(\d\d)$/);
const subj=m?m[1]:(id.startsWith('f-')?null:null);
const meta=[];
if(m&&SUBJ[m[1]]){meta.push(`<span class="pill" style="background:var(--c-${m[1]})">${SUBJ[m[1]][0]}</span>`);meta.push(`<span class="pill ghost">${m[2]==='r1'?'Round 1 · topic '+(+m[3]):'Round 2 · revision'}</span>`)}
else meta.push(`<span class="pill" style="background:var(--c-mix)">${id.startsWith('f-')?'Final sprint':'Plan'}</span>`);
if(/^\d{4}-\d\d-\d\d$/.test(d)){const x=new Date(d+'T12:00:00');meta.push(`<span class="pill ghost">${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]} ${x.getFullYear()}</span>`)}
meta.push('<span class="pill ghost">60 min</span>');
document.getElementById('meta').innerHTML=meta.join('');

function render(md){
  const html=marked.parse(md,{gfm:true});
  const doc=document.getElementById('doc');doc.innerHTML=html;
  doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t)});
  doc.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  const h=doc.querySelector('h1');if(h)document.title=h.textContent+' · IGCSE';
}
const firstLine=md=>((md.match(/^#\s+(.+)$/m)||[])[1]||'').trim();

if(!id){document.getElementById('doc').innerHTML='<p class="state">No session selected.</p>';}
else fetch('content/'+id+'.md',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(render).catch(()=>{
  document.getElementById('doc').innerHTML='<p class="state">This session page is not available yet.</p>'});

// Weekly review: list that week's topics
const topics=(q.get('topics')||'').split(',').filter(t=>/^[a-z]+-r[12]-\d\d$/.test(t));
if(id==='weekly-review'&&topics.length){
  const box=document.getElementById('weekTopics');box.hidden=false;box.className='week';
  box.innerHTML='<h2>This week’s topics</h2><ol id="wl"></ol><p style="color:var(--muted);font-size:.9rem">Open each one and use its practice questions for the 10 mixed questions.</p>';
  const ol=box.querySelector('#wl');
  topics.forEach(t=>{const li=document.createElement('li');const s=t.split('-')[0];
    li.innerHTML=`<a href="session.html?id=${t}&lang=${lang}"><b style="color:var(--c-${s})">${SUBJ[s]?SUBJ[s][0]:''}</b> · <span>${t}</span></a>`;ol.appendChild(li);
    fetch('content/'+t+'.md').then(r=>r.ok?r.text():'').then(md=>{const f=firstLine(md);if(f)li.querySelector('span').textContent=f})});
}

// Previous / next session in the same subject
if(m&&SUBJ[m[1]]){
  const [name,n1,n2]=SUBJ[m[1]];const seq=[];
  for(let i=1;i<=n1;i++)seq.push(`${m[1]}-r1-${String(i).padStart(2,'0')}`);
  for(let i=1;i<=n2;i++)seq.push(`${m[1]}-r2-${String(i).padStart(2,'0')}`);
  const i=seq.indexOf(id);const out=[];
  const link=(t,label,align)=>{const a=`<a href="session.html?id=${t}&lang=${lang}" style="text-align:${align}"><span>${label}</span><b data-t="${t}">${t}</b></a>`;return a};
  out.push(i>0?link(seq[i-1],'Previous '+name+' session','left'):'<i></i>');
  if(i<seq.length-1)out.push(link(seq[i+1],'Next '+name+' session','right'));
  const p=document.getElementById('pager');p.innerHTML=out.join('');
  p.querySelectorAll('b[data-t]').forEach(b=>fetch('content/'+b.dataset.t+'.md').then(r=>r.ok?r.text():'').then(md=>{const f=firstLine(md);if(f)b.textContent=f}));
}
})();
</script>
</body>
</html>
